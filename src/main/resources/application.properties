spring.application.name=devtasker-api

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devtasker_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=devtasker-api
security.jwt.access-token-minutes=30

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Verificacao de e-mail
app.email-verification.code-length=6
app.email-verification.expiration-minutes=10
app.email-verification.maximum-attempts=5
app.email-verification.resend-interval-seconds=60
app.email-verification.hmac-secret=${EMAIL_VERIFICATION_HMAC_SECRET}

# E-mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}

# Identidade do remetente
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@devtasker.local}
app.mail.from-name=${MAIL_FROM_NAME:DevTasker}
