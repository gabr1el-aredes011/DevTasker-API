spring.datasource.url=jdbc:h2:mem:devtasker_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

security.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
security.jwt.issuer=devtasker-api-test
security.jwt.access-token-minutes=30

app.cors.allowed-origins=http://localhost:4200

app.email-verification.code-length=6
app.email-verification.expiration-minutes=10
app.email-verification.maximum-attempts=5
app.email-verification.resend-interval-seconds=60
app.email-verification.hmac-secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

app.password-recovery.code-length=6
app.password-recovery.expiration-minutes=10
app.password-recovery.maximum-attempts=5
app.password-recovery.resend-interval-seconds=60
app.password-recovery.reset-token-expiration-minutes=10
app.password-recovery.hmac-secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.test-connection=false

app.mail.from-address=no-reply@devtasker.test
app.mail.from-name=DevTasker Test
